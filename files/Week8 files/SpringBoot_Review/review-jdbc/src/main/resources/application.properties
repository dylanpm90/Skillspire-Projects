spring.application.name=review-jdbc

# Settings that change Spring Boot's defaults, without touching Java code.
# The in-memory H2 database, as in Week 7's tesla project. YEAR is an H2 keyword and Vehicle has a year column.
spring.datasource.url=jdbc:h2:mem:review;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR

# Print each SQL statement JdbcTemplate runs, so we can watch a request reach the database.
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# EXTRA: uncomment, restart, and the app moves to localhost:9090.
# server.port=9090
# EXTRA: uncomment, restart, and search the log for "JdbcTemplateAutoConfiguration" (autoconfiguration report).
# debug=true
