spring.application.name=review-jpa

# Same in-memory H2 database as review-jdbc.
spring.datasource.url=jdbc:h2:mem:review;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR

# CHANGED from review-jdbc: no schema.sql or data.sql in this project.
# Hibernate creates the tables from the @Entity classes at startup (and drops them at shutdown).
spring.jpa.hibernate.ddl-auto=create-drop
# Print every SQL statement Hibernate writes and runs: the SQL we no longer write.
spring.jpa.show-sql=true
