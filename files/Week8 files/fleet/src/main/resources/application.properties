spring.application.name=fleet

# LMS Spring Data JPA P2. Same in-memory H2 as Week 7; YEAR is an H2 keyword and Vehicle has a year field.
spring.datasource.url=jdbc:h2:mem:fleet;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
# Hibernate creates the tables from the @Entity classes at startup (the H2 default; written out to see it).
spring.jpa.hibernate.ddl-auto=create-drop
# Print every SQL statement Hibernate runs: the SQL we no longer write.
spring.jpa.show-sql=true
